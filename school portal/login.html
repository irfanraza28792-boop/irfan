<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHBC Portal Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <h1>DHBC Portal</h1>
            <p>Darul Huda Bengal Campus</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
